<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f4ef" />
    <meta name="description" content="Release notes and feature updates for Jottathing." />
    <link rel="icon" type="image/png" href="/jottathing-icon.png" />
    <title>Patch notes | Jottathing</title>
  </head>
  <body class="marketing-demo patch-notes-page">
    <div class="page-split">
      <aside id="reading-pane" class="reading-pane patch-notes-reading-pane" aria-labelledby="page-title">
        <div class="patch-notes-shell">
          <header class="patch-notes-header">
            <a class="patch-notes-brand" href="/" aria-label="Jottathing home">
              <img src="/jottathing-icon.png" alt="" width="28" height="28" />
              <span>Jottathing</span>
            </a>
            <nav aria-label="Jottathing pages">
              <a href="/#capture">Product tour</a>
              <a href="/patch-notes/" aria-current="page">Patch notes</a>
            </nav>
          </header>

          <main class="patch-notes-content">
            <h1 id="page-title">Patch notes</h1>
            <section id="patch-notes-list" class="patch-note-list" aria-label="Jottathing releases"></section>
          </main>

          <footer class="patch-notes-footer">
            <span>Jottathing</span>
            <a href="/">Back to the product tour</a>
          </footer>
        </div>
      </aside>

      <div
        id="split-divider"
        class="split-divider"
        role="separator"
        aria-label="Resize the Jottathing editor"
        aria-orientation="vertical"
        aria-controls="reading-pane jottathing-demo-root"
        aria-valuemin="48"
        aria-valuemax="50"
        aria-valuenow="48"
        aria-valuetext="48% editor pane"
        tabindex="0"
      ><span aria-hidden="true"></span></div>

      <section id="jottathing-demo-root" aria-label="Live Jottathing editor"></section>
    </div>
    <script type="module" src="/src/patchNotesPage.ts"></script>
  </body>
</html>
