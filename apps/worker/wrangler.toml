name = "inkwell-sync"
main = "src/worker.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[durable_objects.bindings]]
name = "SYNC_EVENTS"
class_name = "SyncEventsDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncEventsDO"]

# Create queues before deploying: wrangler queues create inkwell-sync-queue && wrangler queues create inkwell-sync-dlq
[[queues.producers]]
queue   = "inkwell-sync-queue"
binding = "SYNC_QUEUE"

[[queues.consumers]]
queue             = "inkwell-sync-queue"
max_batch_size    = 1
max_batch_timeout = 30
max_retries       = 3
dead_letter_queue = "inkwell-sync-dlq"

[vars]
NOTION_VERSION = "2026-03-11"
INKWELL_ROOT_PAGE_TITLE = "Inkwell"
# Set this to your actual workers.dev URL after deploying once
WORKER_URL = "https://sync.inkwell.byaidan.com"

# Secrets — set with: wrangler secret put <NAME>
#   NOTION_OAUTH_CLIENT_ID
#   NOTION_OAUTH_CLIENT_SECRET
#   SESSION_SECRET            (any random 32+ char string)
#   INKWELL_EXTENSION_ORIGIN      (chrome-extension://YOUR_EXTENSION_ID)
#   SUPABASE_URL              (Project Settings → API → Project URL)
#   SUPABASE_SERVICE_KEY      (Project Settings → API → service_role key)
#   NOTION_WEBHOOK_SECRET     (the verification_token from Notion's webhook verification request)
