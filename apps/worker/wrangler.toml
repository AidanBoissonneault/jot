name = "jottathing-sync"
main = "src/proxy.js"
compatibility_date = "2026-10-27"
workers_dev = true
routes = [{ pattern = "sync.jottathing.byaidan.com", custom_domain = true }]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[services]]
binding = "JOTTATHING_CORE"
service = "inkwell-sync"
